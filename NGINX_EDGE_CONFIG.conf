# =====================================================
# PakStream Edge Server Configuration
# Edge Server Port: 8080
# Origin Server: localhost:5000
# =====================================================

# Cache zone definition
# Store cache in /var/cache/nginx/pakstream
# Cache size: 50GB max
# Inactive: 7 days (delete if not accessed for 7 days)
proxy_cache_path /var/cache/nginx/pakstream 
                 levels=1:2 
                 keys_zone=pakstream_cache:100m 
                 max_size=50g 
                 inactive=7d 
                 use_temp_path=off;

# Rate limiting for API (optional - prevent abuse)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream origin_backend {
    server localhost:5000;
    keepalive 32;  # Connection pooling
}

server {
    listen 8080;
    server_name localhost;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/pakstream-access.log combined;
    error_log /var/log/nginx/pakstream-error.log warn;

    # ===========================================
    # VIDEO CONTENT - Heavy Caching (7 days)
    # ===========================================
    location /uploads/videos/ {
        proxy_pass http://origin_backend;
        
        # Enable caching
        proxy_cache pakstream_cache;
        proxy_cache_valid 200 7d;  # Cache videos for 7 days
        proxy_cache_valid 404 1h;  # Cache 404s for 1 hour
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        # Cache key (URL-based)
        proxy_cache_key $scheme$proxy_host$request_uri;
        
        # Bypass cache for POST/PUT/DELETE
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache control
        add_header X-Cache-Status $upstream_cache_status always;
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # Security
        proxy_hide_header X-Powered-By;
    }
    
    # ===========================================
    # IMAGES - Aggressive Caching (30 days)
    # ===========================================
    location ~* /uploads/.*\.(jpg|jpeg|png|gif|webp|svg)$ {
        proxy_pass http://origin_backend;
        proxy_cache pakstream_cache;
        proxy_cache_valid 200 30d;
        
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_bypass $http_authorization;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Compression for images
        gzip on;
        gzip_types image/jpeg image/png image/gif image/webp;
    }
    
    # ===========================================
    # PRESENTATIONS - Medium Caching (7 days)
    # ===========================================
    location /uploads/presentations/ {
        proxy_pass http://origin_backend;
        proxy_cache pakstream_cache;
        proxy_cache_valid 200 7d;
        
        proxy_cache_key $scheme$proxy_host$request_uri;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
        add_header Cache-Control "public";
        
        # Allow range requests for PDFs
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # ===========================================
    # API ENDPOINTS - NO CACHE
    # ===========================================
    location /api/ {
        proxy_pass http://origin_backend;
        
        # Explicitly disable caching for APIs
        proxy_cache off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Rate limiting (optional)
        # limit_req zone=api_limit burst=20 nodelay;
        
        # WebSocket support for long connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for large uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Disable buffering for real-time features
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ===========================================
    # SOCKET.IO - Real-time (NO CACHE)
    # ===========================================
    location /socket.io/ {
        proxy_pass http://origin_backend;
        proxy_cache off;
        
        # WebSocket configuration
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Long timeouts for WebSocket
        proxy_buffering off;
        proxy_read_timeout 86400s;  # 24 hours
        proxy_send_timeout 86400s;
        
        # No caching headers
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ===========================================
    # HEALTH CHECK ENDPOINT
    # ===========================================
    location /health {
        access_log off;
        return 200 "Edge server is healthy\n";
        add_header Content-Type text/plain;
    }

    # ===========================================
    # CACHE STATUS ENDPOINT (For Monitoring)
    # ===========================================
    location /cache-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }


}

